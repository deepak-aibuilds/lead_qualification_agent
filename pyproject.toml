[project]
name = "lead_qualification_agent"
version = "0.1.0"
description = "Automate manual lead scoring with a LangGraph multi-agent pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "fastapi-limiter>=0.2.0",
    "httpx>=0.28.1",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "langgraph>=1.2.4",
    "langsmith>=0.8.9",
    "pydantic-settings>=2.14.0",
    "pyrate-limiter>=4.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.30",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.58.0",
    "uvicorn>=0.46.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
